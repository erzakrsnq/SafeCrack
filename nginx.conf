server {
    listen 80;
    server_name _;

    include /etc/nginx/mime.types;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Unity WebGL pre-compressed Brotli files.
    location ~ \.data\.br$ {
        gzip off;
        add_header Content-Encoding br;
        default_type application/octet-stream;
    }

    location ~ \.wasm\.br$ {
        gzip off;
        add_header Content-Encoding br;
        default_type application/wasm;
    }

    location ~ \.js\.br$ {
        gzip off;
        add_header Content-Encoding br;
        default_type application/javascript;
    }

    # Optional gzip variants (if generated).
    location ~ \.data\.gz$ {
        gzip off;
        add_header Content-Encoding gzip;
        default_type application/octet-stream;
    }

    location ~ \.wasm\.gz$ {
        gzip off;
        add_header Content-Encoding gzip;
        default_type application/wasm;
    }

    location ~ \.js\.gz$ {
        gzip off;
        add_header Content-Encoding gzip;
        default_type application/javascript;
    }

    # Basic compression for text assets.
    gzip on;
    gzip_types
        text/plain
        text/css
        application/javascript
        application/json
        application/wasm
        application/octet-stream;
}
